; pygbag build configuration for digimon-rpg.
;
; CI runs `python -m pygbag --build main.py` (.github/workflows/auto-merge.yml)
; and publishes build/web to GitHub Pages. Without this file pygbag packs the
; entire app folder into the bundle -- including .venv, tests/, doc/ and any
; local reference material -- which bloats the download and can publish files
; that should never be public.
;
; Entries under [DEPENDENCIES] are a DENYLIST; there is no allowlist mode in
; pygbag 0.9.3.
;
; IMPORTANT -- entries MUST be written with a leading slash ("/doc", "/.venv").
; pygbag's filter (filtering.py) compares the walked folder's posix path
; against these strings:
;
;   * `Path(folder).match(block)` only matches the FINAL path component, so
;     "/.venv" would not exclude "/.venv/Lib/site-packages";
;   * `fx.startswith(f"{block}/")` needs the block to carry the same leading
;     slash, since top-level folders are yielded as "/doc", "/tests" etc.
;
; A leading slash is therefore the only form that excludes a whole subtree,
; and it matches the built-in defaults in filtering.py.
;
; "/doc" is listed because it holds local-only Bandai franchise art that must
; never reach a public site (NFR-07, doc/SRS.md). Note that .gitignore alone
; does not prevent that: pygbag walks the working tree, not the git index, so
; a developer with the file on disk would otherwise publish it.
;
; "/digimon-rpg-svc4" is a local reference implementation used for
; development; it must never ship in the WASM bundle.
;
; Keep /assets out of this list: the baked creature sprites under
; /assets/sprites/creatures/ must ship, since core/assets.py loads them.

[DEPENDENCIES]
ignoreDirs = [
      "/doc"
    , "/tests"
    , "/tools"
    , "/__pycache__"
    , "/.pytest_cache"
    , "/build"
    , "/.venv"
    , "/venv"
    , "/digimon-rpg-svc4"
    ]
ignoreFiles = [
      "pygbag.ini"
    , "AGENTS.md"
    , "TOCTREE.md"
    , "CHANGELOG.md"
    , ".gitignore"
    ]
